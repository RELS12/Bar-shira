<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שירה סופן - האתר האישי</title>
    <style>
        /* איפוס בסיסי ועיצוב כללי */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf8f5; /* רקע כללי רך וחם מאוד */
            color: #2c221e;
            line-height: 1.7;
            scroll-behavior: smooth;
        }

        /* סרגל ניווט עליון שקוף ונקי */
        header.navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            z-index: 10;
        }

        .navbar .logo {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        .navbar nav a {
            color: #ffffff;
            text-decoration: none;
            margin-right: 30px;
            font-size: 1.05rem;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease;
        }

        .navbar nav a:hover {
            opacity: 0.75;
        }

        /* אזור הפתיחה (Hero Section) - התמונה ברקע */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh; /* תופס את כל המסך בהתחלה לחוויה מרשימה */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            background-image: url('image_794b88.jpg'); /* קובץ התמונה שלך[cite: 2] */
            background-size: cover;
            background-position: center center;
        }

        /* שכבה שקופה וחמימה מעל התמונה כדי שהטקסט יהיה ברור, קריא ונעים לעין */
        .hero-section::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(35, 25, 20, 0.55); /* גוון חם וכהה עמוק שיוצר אווירה מזמינה */
            z-index: 1;
        }

        /* תוכן הטקסט שיושב מעל התמונה */
        .hero-content {
            position: relative;
            z-index: 2;
            color: #ffffff;
            max-width: 850px;
            padding: 0 20px;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
        }

        .hero-content p {
            font-size: 1.4rem;
            margin-bottom: 35px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            font-weight: 300;
        }

        /* כפתור פעולה מזמין */
        .hero-btn {
            display: inline-block;
            background-color: #d4a373; /* צבע חם ונעים */
            color: #2c221e;
            padding: 15px 35px;
            font-size: 1.15rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 35px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .hero-btn:hover {
            background-color: #e3b586;
            transform: translateY(-3px);
        }

        /* אזור תוכן מרכזי של האתר */
        .content-section {
            max-width: 900px;
            margin: 90px auto 50px auto;
            padding: 0 20px;
            text-align: center;
        }

        .content-section h2 {
            font-size: 2.5rem;
            color: #4a3b32;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .content-section p {
            font-size: 1.2rem;
            color: #5c4d44;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        /* רשת כרטיסים להמחשת תכנים או תחומי פעילות */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1050px;
            margin: 60px auto 100px auto;
            padding: 0 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(44, 34, 30, 0.05);
            border: 1px solid #eee8e2;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(44, 34, 30, 0.1);
        }

        .card h3 {
            color: #4a3b32;
            margin-bottom: 15px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .card p {
            color: #7d6b60;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* תחתית האתר (Footer) */
        footer {
            background-color: #f0ece6;
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid #e3dcd3;
            color: #7d6b60;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- סרגל ניווט עליון -->
    <header class="navbar">
        <div class="logo">שירה סופן</div>
        <nav>
            <a href="#">בית</a>
            <a href="#about">אודות</a>
            <a href="#services">תחומים</a>
        </nav>
